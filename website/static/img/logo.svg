<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <clipPath id="shieldClip">
      <path d="M50 50 H550 V380 C550 520 360 610 300 650 C240 610 50 520 50 380 Z"/>
    </clipPath>
  </defs>

  <!-- Shield contents (transparent outside) -->
  <g clip-path="url(#shieldClip)">
    <!-- Even horizontal stripes (6 bands, 100px each) -->
    <rect x="0" y="50"  width="600" height="100" fill="#F6EB61"/> <!-- Yellow -->
    <rect x="0" y="150" width="600" height="100" fill="#2FA83A"/> <!-- Green -->
    <rect x="0" y="250" width="600" height="100" fill="#F6EB61"/> <!-- Yellow -->
    <rect x="0" y="350" width="600" height="100" fill="#2FA83A"/> <!-- Green -->
    <rect x="0" y="450" width="600" height="100" fill="#F6EB61"/> <!-- Yellow -->
    <rect x="0" y="550" width="600" height="100" fill="#2FA83A"/> <!-- Green -->

    <!-- Diagonal red band (TL -> BR) with aligned black edges -->
    <!-- Position tweak lives in translate(...) below -->
    <g transform="translate(20 -60) rotate(45 300 350)">
      <rect x="-150" y="300" width="900" height="14" fill="#000000"/>
      <rect x="-150" y="314" width="900" height="110" fill="#D32011"/>
      <rect x="-150" y="424" width="900" height="14" fill="#000000"/>
    </g>
  </g>

  <!-- Outer shield border (single consistent stroke) -->
  <path d="M50 50 H550 V380 C550 520 360 610 300 650 C240 610 50 520 50 380 Z"
        fill="none" stroke="#000000" stroke-width="14"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>